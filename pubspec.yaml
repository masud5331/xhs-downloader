name: xhs_downloader
description: >
  A complete, production-ready Flutter Android App for Xiaohongshu (RedNote / 小红书)
  profile batch video downloading. Download entire profiles or single posts in the
  highest quality, watermark-free.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # Networking & Downloading
  dio: ^5.4.3

  # File System & Paths
  path_provider: ^2.1.2

  # Permissions (Storage, Notifications)
  permission_handler: ^11.3.0

  # Local Storage (Settings, History, Logs)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Simple Key-Value Storage (Cookie persistence)
  shared_preferences: ^2.2.2

  # File Picker (for cookies.txt upload)
  file_picker: ^6.1.1

  # State Management
  provider: ^6.1.1

  # Local Push Notifications
  flutter_local_notifications: ^17.0.0

  # Date/Time Formatting
  intl: ^0.19.0

  # HTML Parsing (for scraping XHS pages)
  html: ^0.15.4

  # Unique IDs
  uuid: ^4.3.3

  # URL Launcher (for opening links in browser)
  url_launcher: ^6.2.4

  # Toast messages
  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  # To add assets (icons, images), add them here:
  # assets:
  #   - assets/images/
